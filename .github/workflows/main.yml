name: CI/CD Pipeline (L5)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
  IMAGE_NAME: flaskwall
  DEPLOYMENT_NAME: flaskwall
  NAMESPACE: production

jobs:
  build-and-test:
    name: Building and Testing
    runs-on: ubuntu-latest

    steps:
      - name: Download Code (Checkout)
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Lib installation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check code syntax
        run: |
          python -m py_compile run.py
          echo "Success!"

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-east4-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                     ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

